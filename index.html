<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>xin家装修灵感库</title>
  <style>
    :root{--bg:#e8e7e2;--paper:#f8f7f3;--ink:#252724;--muted:#73766f;--line:#d7d6cf;--accent:#8a6550;--accent2:#c9b29e;--green:#627268;--shadow:0 16px 44px rgba(35,39,35,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif} button,input,select,textarea{font:inherit}
    body{background:radial-gradient(circle at 12% 0%,#f4f2ec 0,transparent 34%),radial-gradient(circle at 90% 16%,#d9ddd7 0,transparent 30%),var(--bg);background-attachment:fixed}.shell{max-width:1240px;margin:auto;padding:28px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand h1{font-family:Georgia,"Songti SC",serif;font-size:30px;margin:0 0 4px;letter-spacing:.02em}.brand p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}
    button,.file-btn{border:1px solid var(--line);background:rgba(248,247,243,.88);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px}.file-btn input{display:none}button:hover,.file-btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px #2f342e18}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.danger{color:#9b3f35}.hero{background:linear-gradient(132deg,#242925 0%,#3e4841 55%,#6d665c 100%);color:#fff;border-radius:24px;padding:28px 30px;display:grid;grid-template-columns:1fr auto;gap:20px;box-shadow:var(--shadow);margin-bottom:18px}.hero h2{font-family:Georgia,"Songti SC",serif;font-size:26px;margin:0 0 8px}.hero p{margin:0;color:#e3e4df}.count{font-family:Georgia,serif;font-size:52px;line-height:1}.count small{font:13px ui-sans-serif;color:#d7dbd5;display:block;text-align:right}
    .toolbar{background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(130px,180px);gap:10px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(10px);box-shadow:0 6px 20px #51402d0a}.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;outline:none;color:var(--ink)}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a85f3b15}.results{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 14px;color:var(--muted);font-size:14px}
    .grid{columns:3 300px;column-gap:16px}.card{break-inside:avoid;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 16px;box-shadow:0 5px 18px #59412d0a;transition:.18s;overflow:hidden}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:calc(100% + 36px);margin:-18px -18px 16px;gap:3px}.card-gallery img{flex:0 0 100%;width:100%;height:220px;object-fit:cover;scroll-snap-align:start}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.card h3{font-family:Georgia,"Songti SC",serif;font-size:19px;margin:9px 0 6px;line-height:1.35}.tag{font-size:12px;padding:5px 9px;border-radius:99px;background:#eee5d8;color:#705642;white-space:nowrap}.note{border-top:1px solid var(--line);padding-top:11px;margin-top:13px}.note b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.note p{margin:0;line-height:1.6;font-size:14px;white-space:pre-wrap}.link-list{display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.link{color:var(--accent);font-size:12px;text-decoration:none;background:#eee8df;padding:6px 9px;border-radius:9px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:flex-end;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.mini{padding:6px 9px;border-radius:9px;font-size:12px}.empty{text-align:center;padding:70px 20px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:18px}
    dialog{border:0;padding:0;border-radius:22px;width:min(760px,calc(100% - 28px));max-height:90vh;box-shadow:0 25px 80px #0005;background:var(--paper)}dialog::backdrop{background:#29251f99;backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}.modal-head h2{font:23px Georgia,"Songti SC",serif;margin:0}.close{border:0;font-size:22px;padding:4px 9px}.form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.form label{font-size:13px;color:var(--muted);display:block}.form label span{display:block;margin-bottom:7px}.wide{grid-column:1/-1}.form textarea{min-height:82px;resize:vertical}.photo-box{border:1px dashed #bdbbb2;border-radius:14px;padding:12px;background:#fff}.photo-box input{width:100%}.photo-previews{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}.photo-thumb img{width:100%;height:100%;object-fit:cover}.photo-thumb button{position:absolute;right:5px;top:5px;padding:3px 7px;background:#282824dd;color:#fff;border:0}.link-editor{display:grid;gap:8px}.link-row{display:grid;grid-template-columns:140px 1fr auto;gap:7px}.add-row{margin-top:8px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#292722;color:#fff;padding:11px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:720px){.shell{padding:18px 14px 40px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions>*{flex:1;justify-content:center}.hero{padding:23px 20px}.hero .count{font-size:40px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.grid{columns:1}.form{grid-template-columns:1fr}.wide{grid-column:auto}.link-row{grid-template-columns:1fr auto}.link-row .link-label{grid-column:1/-1}.photo-previews{grid-template-columns:repeat(2,1fr)}.brand h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><h1>xin家装修灵感库</h1></div><div class="actions"><button id="exportBtn">↗ 导出</button><label class="file-btn">↙ 导入<input id="importInput" type="file" accept="application/json"></label><button class="primary" id="addBtn">＋ 新增灵感</button></div></header>
    <section class="hero"><div><h2>Living Archive</h2></div><div class="count"><span id="totalCount">0</span><small>条灵感</small></div></section>
    <section class="toolbar"><input class="field search" id="search" placeholder="搜索标题、想法、商家…"><select class="field" id="spaceFilter"><option value="">全部空间</option></select></section>
    <div class="results"><span id="resultText"></span><button class="mini" id="clearFilters">清除筛选</button></div><section class="grid" id="grid"></section>
  </main>
  <dialog id="editor"><form id="form"><div class="modal-head"><h2 id="modalTitle">新增装修灵感</h2><button class="close" type="button" id="closeBtn">×</button></div><div class="form">
    <label class="wide"><span>标题 *</span><input class="field" name="title" required maxlength="80" placeholder="例如：原木感阳光房"></label>
    <label><span>空间分类</span><select class="field" name="space" id="spaceInput"></select></label>
    <label class="wide"><span>来源链接（可添加多个）</span><div id="linkEditor" class="link-editor"></div><button class="mini add-row" type="button" id="addLink">＋ 添加链接</button></label>
    <label class="wide"><span>灵感照片（可一次选择多张）</span><div class="photo-box"><input id="photoInput" type="file" accept="image/*" multiple><div id="photoPreviews" class="photo-previews"></div></div></label>
    <label><span>喜欢的地方</span><textarea class="field" name="likes" placeholder="哪些细节让你心动？"></textarea></label><label><span>不适合我家的地方</span><textarea class="field" name="dislikes" placeholder="记录限制和需要避开的地方"></textarea></label>
    <label class="wide"><span>想借鉴的设计</span><textarea class="field" name="borrow" placeholder="真正准备带回家的设计"></textarea></label>
  </div><div class="modal-foot"><button type="button" id="cancelBtn">取消</button><button class="primary" type="submit">保存灵感</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{'use strict';
    const SPACES=['全屋','玄关','宠物房','客厅','钢琴区','投影区','餐厅','厨房','主卧','主卫','次卧','多功能房','衣帽间','洗衣收纳间','卫生间','阳台','露台','阳光房','庭院','家具','灯光','家电','智能家居','收纳','装修避坑'];
    const KEY='zhuguang-inspirations-v1';
    const samples=[
      {id:'sample-sunroom',title:'原木感阳光房与绿植角',url:'https://www.douyin.com/',space:'阳光房',status:'准备采用',likes:'柔和日光、原木色和大量绿植，坐下来很放松。',dislikes:'玻璃顶夏天可能过热；需要结合物业规定。',borrow:'做可移动遮阳帘，靠墙设置阅读椅和矮柜。',vendor:'待咨询本地门窗与遮阳商家'},
      {id:'sample-terrace',title:'露台休闲区：防腐木与户外灯串',url:'https://www.xiaohongshu.com/',space:'露台',status:'待研究',likes:'夜晚氛围温暖，有聚会感；高低错落的盆栽很好看。',dislikes:'木材维护成本高，雨季排水要重点确认。',borrow:'仅在休息区铺木塑地板，保留检修口与排水坡度。',vendor:'木塑地板需索取耐候等级与质保'},
      {id:'sample-living',title:'客厅无主灯＋低矮家具布局',url:'https://example.com/',space:'客厅',status:'刚收藏',likes:'视觉很开阔，灯光层次干净，动线舒服。',dislikes:'过多射灯可能眩光；沙发过低不适合长辈。',borrow:'洗墙灯照装饰画，沙发选择中等坐高。',vendor:'照明设计待定'},
      {id:'sample-kitchen',title:'厨房高柜与小家电收纳',url:'',space:'厨房',status:'已确定',likes:'台面清爽，小家电能直接抽拉使用。',dislikes:'柜体太深时内部物品不易取。',borrow:'预留独立回路和可抽拉层板。',vendor:'让橱柜商提供五金型号'}
    ];
    const houseProfiles=[
      {id:'house-overall',title:'全屋定位｜00后美式＋法式',url:'',space:'全屋',status:'待研究',likes:'年轻、克制的美式与法式融合；要有高级感、空间感和充足光线，日常拍照好看。偏好木材本身的颜色和质感。',dislikes:'不要复杂花色、老气配色、过度堆砌法式雕花，也不要为了装饰压缩空间。',borrow:'全屋以显大和通透为优先。地面优先考虑进口整板木地板，也可按功能分区采用木地板＋瓷砖。统一材质、控制颜色数量，并规划全屋智能家居。',vendor:'设计总则：所有区域方案都按这套标准核对。'},
      {id:'house-pet',title:'入户右侧｜宠物房',url:'',space:'宠物房',status:'待研究',likes:'进门右手设置独立宠物房，方便照顾宠物，也与主要起居空间适当分开。',dislikes:'避免异味进入客厅；不要让宠物用品在入户处显得杂乱。',borrow:'重点规划通风、易清洁地面、洗护位置、宠物用品收纳、饮水与智能设备电源。',vendor:'方位：入户右手。'},
      {id:'house-living',title:'开放式客厅｜沙发、钢琴与投影',url:'',space:'客厅',status:'待研究',likes:'入户左转进入开放式客厅，以一组大沙发为中心；北面为钢琴区，南面布置投影。整体要开阔、明亮、上镜。',dislikes:'不要传统电视墙造成压迫感；避免家具过多、动线拥挤或吊顶过重。',borrow:'围绕观影、弹琴和交流三种使用场景安排沙发与通道；投影设备、幕布、音响、遮光和插座提前预埋。',vendor:'方位：北侧钢琴，南侧投影；西接露台，东接厨房。'},
      {id:'house-multi',title:'南侧｜多功能房',url:'',space:'多功能房',status:'待研究',likes:'位于投影后方，暂不限定用途，根据今后的兴趣调整。希望有类似阳光房的轻松、明亮和绿意感。',dislikes:'现状无法与阳台打通，不希望因此变成封闭、昏暗或闲置的房间。',borrow:'先做弹性空间：保证采光、留白、可移动家具、充足插座和收纳，可在阅读、手作、健身、休闲植物房等用途之间转换。',vendor:'方位：客厅及投影区南面；不能与阳台打通。'},
      {id:'house-terrace',title:'西侧｜第四代住宅露台',url:'',space:'露台',status:'待研究',likes:'客厅西面的大露台，是第四代住宅最重要的景观和生活空间。',dislikes:'避免堆满固定家具；注意物业限制、防水排水、日晒、风雨和后期维护。',borrow:'规划户外休闲、绿植、遮阳、夜景照明与室内视线关系，让露台从客厅看出去也保持整洁、有层次。',vendor:'方位：客厅西面。'},
      {id:'house-kitchen',title:'东侧｜开放式厨房与岛台',url:'',space:'厨房',status:'待研究',likes:'客厅东面设置开放式厨房；不放传统餐桌，以大岛台代替，让公共区域更完整、更显大。',dislikes:'不要餐桌切碎空间；避免小家电外露、台面杂乱和智能设备后期无处安装。',borrow:'岛台兼顾备餐、轻食和社交。提前规划制冰机等智能电器，以及净水、排水、散热、电源、嵌入式电器和隐藏收纳。',vendor:'方位：客厅东面；重点设备包括制冰机及厨房智能家居。'},
      {id:'house-master',title:'北侧｜主卧＋主卫',url:'',space:'主卧',status:'待研究',likes:'主卧与主卫组成相对独立的私密套房。整体延续年轻的美式＋法式，但要安静、舒展。',dislikes:'避免繁复床头造型、花纹墙布和老气的对称堆砌。',borrow:'关注卧室采光、遮光、智能照明、床周动线与主卫使用体验；材质和公共区域保持关联。',vendor:'方位：户型北侧。'},
      {id:'house-closet',title:'东侧小房间｜衣帽间',url:'',space:'衣帽间',status:'待研究',likes:'东侧两个小房间之一作为独立衣帽间。',dislikes:'避免只追求展示效果而牺牲容量，也不要出现难清洁的开放格过多。',borrow:'按长衣、短衣、叠放、包袋、首饰和行李分类；规划全身镜、灯光、除湿与换衣动线。',vendor:'方位：东侧小房间之一。'},
      {id:'house-laundry',title:'东侧小房间｜洗衣收纳间',url:'',space:'洗衣收纳间',status:'待研究',likes:'另一个东侧小房间集中承担洗衣、家政和全屋杂物收纳。',dislikes:'避免洗衣机、清洁工具和囤货散落在其他房间；注意噪音与潮气。',borrow:'规划洗衣机、烘干机、洗衣池、晾挂、清洁工具柜、耗材囤货和折叠台，并预留上下水、地漏、通风与智能设备。',vendor:'方位：东侧小房间之一。'}
    ];
    const $=s=>document.querySelector(s); let items=load(); let editingId=null,draftPhotos=[],draftLinks=[];
    function cleanItem(x){const y={...x};delete y.stars;delete y.budget;if(!Array.isArray(y.photos))y.photos=y.photo?[y.photo]:[];if(!Array.isArray(y.links))y.links=y.url?[{label:'来源链接',url:y.url}]:[];delete y.photo;delete y.url;return y}
    function load(){let data;try{const raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw).map(cleanItem)}catch(e){}if(!data)data=structuredClone(samples);if(!localStorage.getItem('xin-home-profile-v1')){const ids=new Set(data.map(x=>x.id));data=[...houseProfiles.filter(x=>!ids.has(x.id)),...data];localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('xin-home-profile-v1','1')}else if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(data));return data}
    function save(){localStorage.setItem(KEY,JSON.stringify(items))}
    function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function note(label,val){return val?`<div class="note"><b>${label}</b><p>${esc(val)}</p></div>`:''}
    function render(){const q=$('#search').value.trim().toLowerCase(),sp=$('#spaceFilter').value;const shown=items.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!sp||x.space===sp));$('#totalCount').textContent=items.length;$('#resultText').textContent=`显示 ${shown.length} / ${items.length} 条灵感`;$('#grid').innerHTML=shown.length?shown.map(raw=>{const x=cleanItem(raw),gallery=x.photos.length?`<div class="card-gallery">${x.photos.map((p,i)=>`<img src="${esc(p)}" alt="${esc(x.title)} ${i+1}">`).join('')}</div>`:'',links=x.links.length?`<div class="link-list">${x.links.map((l,i)=>`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||`链接 ${i+1}`)} ↗</a>`).join('')}</div>`:'';return `<article class="card">${gallery}<div class="card-top"><span class="tag">${esc(x.space)}</span></div><h3>${esc(x.title)}</h3>${note('喜欢的地方',x.likes)}${note('不适合我家',x.dislikes)}${note('想借鉴的设计',x.borrow)}${links}<div class="meta"><span><button class="mini edit" data-id="${esc(x.id)}">编辑</button> <button class="mini danger del" data-id="${esc(x.id)}">删除</button></span></div></article>`}).join(''):'<div class="empty">没有找到符合条件的灵感。<br>换个筛选条件，或新增一条吧。</div>'}
    function options(el,arr){el.insertAdjacentHTML('beforeend',arr.map(v=>`<option value="${v}">${v}</option>`).join(''))} options($('#spaceFilter'),SPACES);options($('#spaceInput'),SPACES);
    function showPhotos(){$('#photoPreviews').innerHTML=draftPhotos.map((p,i)=>`<div class="photo-thumb"><img src="${esc(p)}" alt="照片 ${i+1}"><button type="button" data-photo="${i}">×</button></div>`).join('')}
    function showLinks(){$('#linkEditor').innerHTML=draftLinks.map((l,i)=>`<div class="link-row" data-link="${i}"><input class="field link-label" value="${esc(l.label||'')}" placeholder="名称，如：抖音"><input class="field link-url" type="url" value="${esc(l.url||'')}" placeholder="https://..."><button class="mini danger remove-link" type="button">删除</button></div>`).join('')}
    function syncLinks(){draftLinks=[...document.querySelectorAll('.link-row')].map(r=>({label:r.querySelector('.link-label').value.trim(),url:r.querySelector('.link-url').value.trim()}))}
    function openEditor(item){editingId=item?.id||null;const current=item?cleanItem(item):null;draftPhotos=current?[...current.photos]:[];draftLinks=current?[...current.links]:[{label:'',url:''}];$('#modalTitle').textContent=item?'编辑装修灵感':'新增装修灵感';$('#form').reset();if(current)Object.keys(current).forEach(k=>{const e=$('#form').elements[k];if(e&&e.type!=='file')e.value=current[k]});showPhotos();showLinks();$('#editor').showModal();setTimeout(()=>$('#form').elements.title.focus(),50)}
    function close(){ $('#editor').close() } function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    $('#addBtn').onclick=()=>openEditor();$('#closeBtn').onclick=close;$('#cancelBtn').onclick=close;$('#editor').onclick=e=>{if(e.target===$('#editor'))close()};
    $('#photoInput').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;try{const added=[];for(const file of files)added.push(await compressImage(file));draftPhotos.push(...added);showPhotos();toast(`已添加 ${added.length} 张照片`)}catch(err){alert('部分照片读取失败，请换一张图片重试。')}e.target.value=''};
    $('#photoPreviews').onclick=e=>{const b=e.target.closest('[data-photo]');if(!b)return;draftPhotos.splice(Number(b.dataset.photo),1);showPhotos()};
    $('#addLink').onclick=()=>{syncLinks();draftLinks.push({label:'',url:''});showLinks()};
    $('#linkEditor').onclick=e=>{const b=e.target.closest('.remove-link');if(!b)return;syncLinks();draftLinks.splice(Number(b.closest('.link-row').dataset.link),1);showLinks()};
    function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8))};img.src=reader.result};reader.readAsDataURL(file)})}
    $('#form').onsubmit=e=>{e.preventDefault();syncLinks();const data=Object.fromEntries(new FormData(e.target));data.photos=[...draftPhotos];data.links=draftLinks.filter(l=>l.url);data.id=editingId||`${Date.now()}-${Math.random().toString(16).slice(2)}`;if(editingId)items=items.map(x=>x.id===editingId?data:x);else items.unshift(data);try{save()}catch(err){alert('浏览器存储空间不足。请减少照片数量、换用更小的照片，或先导出并删除部分旧内容。');return}render();close();toast(editingId?'已更新':'已收藏')};
    $('#grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const item=items.find(x=>x.id===b.dataset.id);if(b.classList.contains('edit'))openEditor(item);if(b.classList.contains('del')&&confirm(`确定删除「${item.title}」吗？`)){items=items.filter(x=>x.id!==item.id);save();render();toast('已删除')}};
    ['search','spaceFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#clearFilters').onclick=()=>{$('#search').value='';$('#spaceFilter').value='';render()};
    $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'xin家装修灵感库',version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`xin家装修灵感库-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('已导出备份')};
    $('#importInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),arr=Array.isArray(obj)?obj:obj.items;if(!Array.isArray(arr))throw Error();if(!confirm(`将导入 ${arr.length} 条数据，并替换当前内容，继续吗？`))return;items=arr.filter(x=>x&&x.title).map(x=>cleanItem({...x,id:x.id||crypto.randomUUID()}));save();render();toast('导入成功')}catch(err){alert('导入失败：请选择由本应用导出的 JSON 文件。')}finally{e.target.value=''}};
    render();
  })();
  </script>
</body></html>
